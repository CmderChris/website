name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/pip-walk/.nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed bundles and the scene's model/textures: cache for a year
      - name: Upload static assets
        run: |
          aws s3 sync apps/web/dist s3://${{ secrets.S3_BUCKET }} \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      # index.html is always revalidated so a deploy shows up immediately
      - name: Upload index.html
        run: |
          aws s3 cp apps/web/dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
